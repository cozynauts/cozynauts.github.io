<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Eldritch Horror – Rangliste</title>

  <style>
    :root {
      --bg: #050510;
      --panel: #141426;
      --panel-soft: #1d1d35;
      --accent: #bfaeff;
      --text: #f5f5ff;
      --muted: #a0a0c0;
      --border-soft: rgba(255,255,255,0.08);
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #16162e 0, #050510 55%, #020208 100%);
      color: var(--text);
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: rgba(10,10,25,0.98);
      border-right: 1px solid var(--border-soft);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      color: var(--muted);
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 8px;
      transition: 0.2s;
    }

    .nav-item:hover {
      color: var(--text);
      background: rgba(255,255,255,0.08);
    }

    .nav-item.active {
      color: var(--text);
      background: linear-gradient(90deg,#5b4bff,#bfaeff);
      box-shadow: 0 0 14px rgba(191,174,255,0.45);
      font-weight: 600;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
    }

    .card {
      background: radial-gradient(circle at top left, #27274a 0, var(--panel) 40%, #0b0b18 100%);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      box-shadow: 0 18px 40px rgba(0,0,0,0.4);
        width: 100%;
        max-width: 950px;          /* 👉 macht die Tabelle schmaler */
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.85rem;
    }

    thead {
      background: rgba(255,255,255,0.05);
    }

    th, td {
      padding: 6px 8px;
    }

    tbody tr:nth-child(odd) {
      background: rgba(255,255,255,0.02);
    }
    tbody tr:nth-child(even) {
      background: rgba(0,0,0,0.15);
    }

    tbody tr:first-child {
      background: rgba(255,215,0,0.18);
    }

    .rankcell {
      width: 40px;
      font-weight: bold;
      text-align: right;
    }

    .point-negative {   /* < 0 Punkte */
  color: #8be58b;
  font-weight: 600;
}

.point-zero {       /* genau 0 Punkte */
  color: #ffd86b;
  font-weight: 600;
}

.point-positive {   /* > 0 Punkte (Siege) */
  color: #f5f5ff;
  font-weight: 600;
}

.point-loss {       /* Niederlage */
  color: #ff7373;
  font-weight: 700;
}

  </style>
</head>

<body>
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-title">Eldritch Horror</div>
    <nav class="nav">
      <a href="EldritchHorrorStatistik.html" class="nav-item">Startseite</a>
      <a href="player_stats.html" class="nav-item">Spielerstatistik</a>
      <a href="character_stats.html" class="nav-item">Charakterstatistik</a>
      <a href="ancient_stats.html" class="nav-item">Gegnerstatistik</a>
      <a href="ranking.html" class="nav-item active">Rangliste</a>
      <a href="history.html" class="nav-item">Historie</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h1>Rangliste – Beste & Schlechteste Spielergebnisse</h1>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Rang</th>
            <th>Punkte</th>
            <th>Gegner</th>
            <th>Datum</th>
            <th>Teilnehmer</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
    </div>
  </main>

</div>

<script>
function formatDate(d){
  const [y,m,day] = d.split("-");
  return `${day}.${m}.${y}`;
}

async function loadRanking() {
  const res = await fetch("eldritch_games.csv");
  const txt = await res.text();

  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  if (lines.length <= 1) return;

  const header = lines[0].split(";");
  const rows = lines.slice(1).map(line => {
    const parts = line.split(";");
    const row = {};
    header.forEach((h, idx) => row[h] = (parts[idx] || "").trim());
    return row;
  });

  // 1) Global schlechtester Sieg für Niederlagen-Berechnung
  const winScores = rows
    .filter(r => r.Result !== "Niederlage")
    .map(r => Number(r.Result))
    .filter(n => !isNaN(n));

  const globalWorstWin = winScores.length ? Math.max(...winScores) : 0;

  // 2) Spiele nach Date + AncientOne gruppieren
  const grouped = {};

  for (const row of rows) {
    const key = `${row.Date}_${row.AncientOne}`;
    if (!grouped[key]) {
      grouped[key] = {
        date: row.Date,
        ancient: row.AncientOne,
        results: [],
        players: new Set()
      };
    }
    grouped[key].results.push(row.Result);
    grouped[key].players.add(row.Player);
  }

  // 3) Pro Spiel einen Eintrag für die Rangliste bauen
  const games = Object.values(grouped).map(g => {
    // Result ist pro Spiel konsistent, wir nehmen einfach das erste
    const firstResult = g.results[0];
    const isLoss = firstResult === "Niederlage";

    let score;
    if (isLoss) {
      // Niederlage = 1,25 × schlechtester Sieg (global)
      score = globalWorstWin * 1.25;
    } else {
      score = Number(firstResult);
    }

    return {
      date: formatDate(g.date),
      ancient: g.ancient,
      score,
      isLoss,
      players: Array.from(g.players).join(", ")
    };
  });

  // 4) Sortieren – beste (kleinste) Punktzahl zuerst
  games.sort((a, b) => a.score - b.score);

  const tbody = document.getElementById("ranking-body");
  tbody.innerHTML = "";

  // 5) Competition Ranking mit Gleichständen
  let currentRank = 0;
  let previousScore = null;

  games.forEach((g, idx) => {
    const tr = document.createElement("tr");

    if (idx === 0) {
      currentRank = 1;
    } else if (g.score !== previousScore) {
      currentRank = idx + 1;
    }
    previousScore = g.score;

    const tdRank = document.createElement("td");
    tdRank.className = "rankcell";
    tdRank.textContent = currentRank;

    const tdScore = document.createElement("td");
    tdScore.textContent = g.score;

    // 6) Farb-Logik für Punkte
    if (g.isLoss) {
      tdScore.className = "point-loss";
    } else if (g.score < 0) {
      tdScore.className = "point-negative";
    } else if (g.score === 0) {
      tdScore.className = "point-zero";
    } else {
      tdScore.className = "point-positive";
    }

    const tdAnc = document.createElement("td");
    tdAnc.textContent = g.ancient;

    const tdDate = document.createElement("td");
    tdDate.textContent = g.date;

    const tdPlayers = document.createElement("td");
    tdPlayers.textContent = g.players;

    tr.append(tdRank, tdScore, tdAnc, tdDate, tdPlayers);
    tbody.appendChild(tr);
  });
}

loadRanking();
</script>


</body>
</html>
